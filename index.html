<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#166b47"><title>Gezins Eetplanner</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#22332b;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}.app{max-width:520px;margin:auto;min-height:100vh;background:#f9faf7;padding-bottom:90px}.top{padding:23px 21px 15px;background:#fff;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center;font-weight:850;color:#166b47;font-size:19px}.mark{background:#e1f3e7;border-radius:13px;padding:9px}.avatar{border-radius:50%;background:#e9efe6;padding:10px;font-size:20px}.content{padding:18px 18px 28px}.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#648273;font-weight:750}h1{font-size:27px;letter-spacing:-.8px;line-height:1.16;margin:6px 0 9px}h2{font-size:19px;margin:23px 0 13px}p{color:#68766d;line-height:1.5;font-size:14px}.hero{position:relative;min-height:205px;border-radius:22px;overflow:hidden;background:linear-gradient(90deg,rgba(12,47,31,.92),rgba(12,47,31,.22)),url('https://images.unsplash.com/photo-1547592180-85f173990554?w=1100&q=80') center/cover;color:white;padding:24px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.hero h1{max-width:260px;font-size:28px}.hero p{color:#e2f2e7;margin:0 0 16px}.btn{background:#19774e;border:0;color:white;border-radius:12px;padding:12px 15px;font-weight:750;cursor:pointer;font-size:13px}.hero .btn{background:#fff;color:#176743}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:white;border:1px solid #e9eee7;border-radius:18px;padding:15px;box-shadow:0 3px 13px #183b2010}.shortcut{min-height:110px;text-align:left;cursor:pointer}.shortcut .icon{font-size:25px;margin-bottom:10px}.shortcut b{display:block;font-size:14px}.shortcut small{color:#7a897f}.row{display:flex;align-items:center;gap:11px}.between{justify-content:space-between}.muted{color:#7a897f;font-size:12px}.pill{border-radius:30px;background:#e8f5e9;color:#22774b;font-weight:700;padding:6px 9px;font-size:11px}.meal{display:flex;align-items:center;gap:12px;margin:10px 0}.meal img,.recipe img{object-fit:cover;border-radius:13px}.meal img{width:76px;height:70px}.meal strong{font-size:14px}.meal button,.tiny{border:1px solid #d8e6dc;background:#fff;border-radius:9px;padding:8px;color:#19774e;cursor:pointer}.day{margin:9px 0;padding:13px}.day .meal{margin:8px 0 0}.dayhead{display:flex;justify-content:space-between;align-items:center}.dayhead strong{font-size:14px}.recipe{overflow:hidden;padding:0}.recipe img{width:100%;height:120px;border-radius:17px 17px 0 0}.recipe .inner{padding:12px}.recipe b{font-size:13px}.recipe small{display:block;color:#77887d;margin-top:5px}.tabs{display:flex;gap:8px;overflow:auto;padding:4px 0 13px}.chip{white-space:nowrap;border:1px solid #dce7dc;border-radius:25px;padding:9px 13px;background:white;color:#456553;font-size:12px;cursor:pointer}.chip.active{background:#19774e;color:white}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);background:#fff;display:flex;justify-content:space-around;border-top:1px solid #e7eee7;padding:10px 4px max(11px,env(safe-area-inset-bottom));z-index:4}.nav button{border:0;background:none;color:#829288;font-size:10px;cursor:pointer;min-width:56px}.nav button span{display:block;font-size:22px;margin-bottom:4px}.nav button.on{color:#18744b;font-weight:800}.line{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid #edf0ed;font-size:13px}.line:last-child{border:0}input[type=checkbox]{accent-color:#19774e;transform:scale(1.15)}input[type=number],input[type=text],select{border:1px solid #dce6dd;padding:10px;border-radius:10px;max-width:100%;background:#fff}.notice{background:#eef7f0;border-radius:14px;padding:13px;color:#42664f;font-size:13px;margin:13px 0}.person{display:flex;gap:12px;align-items:center;margin:12px 0}.face{height:43px;width:43px;border-radius:50%;background:#e5f1e6;display:grid;place-items:center;font-size:23px}.stars button{background:none;border:0;font-size:21px;color:#e6ae36;cursor:pointer}.hidden{display:none}.full{width:100%}label{font-size:13px}.smallbutton{font-size:12px;padding:8px 10px}.stat{color:#19774e;font-size:25px;font-weight:800}footer{font-size:11px;color:#8b9b8e;text-align:center;margin-top:30px}
</style></head><body><div class="app"><header class="top"><div class="brand"><span class="mark">🥗</span><span>Gezins Eetplanner</span></div><span class="avatar">👨‍👩‍👦‍👦</span></header><main id="root" class="content"></main><nav class="nav" id="nav"></nav></div><script>
const base=[{name:'Penne met aubergine en zwarte bonen',img:'photo-1473093295043-cdd812d0e601',mins:30,cat:'Vegetarisch',items:[['Volkoren penne',350,'g'],['Aubergine',2,'st'],['Zwarte bonen',400,'g'],['Tomatenblokjes',400,'g']]},{name:'Pompoen-linzensoep met volkorenbrood',img:'photo-1547592180-85f173990554',mins:35,cat:'Vegetarisch',items:[['Pompoen',800,'g'],['Rode linzen',250,'g'],['Wortel',300,'g'],['Volkoren brood',1,'brood']]},{name:'Spinazielasagne met ricotta',img:'photo-1473093295043-cdd812d0e601',mins:40,cat:'Oven',items:[['Volkoren lasagnebladen',250,'g'],['Spinazie',600,'g'],['Ricotta',250,'g'],['Tomatenpassata',500,'g']]},{name:'Andijviestamppot met zalm',img:'photo-1467003909585-2f8a72700288',mins:30,cat:'Vis',items:[['Aardappelen',900,'g'],['Andijvie',500,'g'],['Zalmfilet',500,'g']]},{name:'Traybake met bloemkool en kikkererwten',img:'photo-1512621776951-a57141f2eefd',mins:35,cat:'Vegetarisch',items:[['Bloemkool',1,'st'],['Kikkererwten',500,'g'],['Zoete aardappel',700,'g'],['Yoghurt',200,'g']]},{name:'Eenpansorzo met kip en groenten',img:'photo-1473093295043-cdd812d0e601',mins:30,cat:'Snel',items:[['Orzo',350,'g'],['Kipfilet',450,'g'],['Courgette',1,'st'],['Paprika',2,'st']]},{name:'Witvis met wortel en aardappelen',img:'photo-1467003909585-2f8a72700288',mins:30,cat:'Vis',items:[['Witvis',500,'g'],['Wortel',600,'g'],['Aardappelen',900,'g']]},{name:'Volkoren couscous met groenten en feta',img:'photo-1512621776951-a57141f2eefd',mins:20,cat:'Snel',items:[['Volkoren couscous',350,'g'],['Paprika',2,'st'],['Courgette',1,'st'],['Feta',200,'g'],['Kikkererwten',400,'g']]},{name:'Volkoren pasta met kip en groenten',img:'photo-1473093295043-cdd812d0e601',mins:25,cat:'Pasta',items:[['Volkoren pasta',350,'g'],['Kipfilet',450,'g'],['Courgette',1,'st'],['Paprika',2,'st'],['Tomatensaus',400,'g']]},{name:'Zalm met krieltjes en broccoli',img:'photo-1467003909585-2f8a72700288',mins:30,cat:'Vis',items:[['Zalmfilet',500,'g'],['Krieltjes',800,'g'],['Broccoli',2,'st']]},{name:'Kipwraps met frisse salade',img:'photo-1512621776951-a57141f2eefd',mins:20,cat:'Snel',items:[['Volkoren wraps',8,'st'],['Kipfilet',450,'g'],['Sla',1,'zak'],['Komkommer',1,'st'],['Yoghurt',200,'g']]},{name:'Groenterijke rijstbowl',img:'photo-1512621776951-a57141f2eefd',mins:25,cat:'Vegetarisch',items:[['Zilvervliesrijst',350,'g'],['Paprika',2,'st'],['Wortel',400,'g'],['Kikkererwten',400,'g']]},{name:'Zelfgemaakte gezonde pizza',img:'photo-1513104890138-7c749659a591',mins:35,cat:'Favoriet',items:[['Pizzabodems',4,'st'],['Mozzarella',250,'g'],['Passata',400,'g'],['Champignons',250,'g']]},{name:'Chili met bonen en rijst',img:'photo-1547592180-85f173990554',mins:30,cat:'Vegetarisch',items:[['Kidneybonen',500,'g'],['Zilvervliesrijst',350,'g'],['Tomatenblokjes',400,'g'],['Mais',300,'g']]},{name:'Ovenkip met zoete aardappel',img:'photo-1532550907401-a500c9a57435',mins:40,cat:'Oven',items:[['Kipfilet',500,'g'],['Zoete aardappel',900,'g'],['Broccoli',1,'st']]}];
const days=['Maandag','Dinsdag','Woensdag','Donderdag','Vrijdag','Zaterdag','Zondag'];const key='gezinsplanner-modern-v12';let state;try{state=JSON.parse(localStorage.getItem(key))}catch(e){}state=Object.assign({menu:[0,-1,2,1,3,4,5],ratings:{},mode:'slim',checked:{},portions:false,profiles:[{name:'Frank',emoji:'👨',activity:'Gemiddeld'},{name:'Evelien',emoji:'👩',activity:'Gemiddeld'},{name:'Dex',emoji:'👦',activity:'Actief'},{name:'Bor',emoji:'🧒',activity:'Actief'}],approved:false},state||{});let page='home',filter='Alles';function save(){localStorage.setItem(key,JSON.stringify(state))}function pic(r){return 'https://images.unsplash.com/'+r.img+'?w=450&q=75'}function go(p){page=p;render();scrollTo(0,0)}function nav(){document.getElementById('nav').innerHTML=[['home','⌂','Home'],['week','🗓','Weekmenu'],['recipes','🍲','Recepten'],['shop','🛒','Boodschappen'],['family','👨‍👩‍👦','Mijn gezin']].map(([p,i,t])=>'<button class="'+(page===p?'on':'')+'" onclick="go(\''+p+'\')"><span>'+i+'</span>'+t+'</button>').join('')}function header(t,sub){return '<div class="eyebrow">Samen gezond & gemakkelijk</div><h1>'+t+'</h1><p>'+sub+'</p>'}function meal(r){return '<div class="meal"><img src="'+pic(r)+'" alt=""><div style="flex:1"><strong>'+r.name+'</strong><div class="muted">⏱ '+r.mins+' min · '+r.cat+'</div></div></div>'}function home(){return '<div class="hero"><div class="eyebrow" style="color:#b9f0ce">Jullie week, minder geregel</div><h1>Wat eten we vandaag?</h1><p>Gezond, lekker en samen gekozen.</p><button class="btn" onclick="go(\'week\')">Bekijk het weekmenu →</button></div><h2>Snel naar</h2><div class="grid">'+[['week','🗓','Mijn week','Bekijk en wijzig'],['recipes','🍲','Recepten','Ontdek iets nieuws'],['shop','🛒','Boodschappen','Slim verdeeld'],['family','👨‍👩‍👦','Mijn gezin','Voeding & voorkeuren']].map(x=>'<button class="card shortcut" onclick="go(\''+x[0]+'\')"><div class="icon">'+x[1]+'</div><b>'+x[2]+'</b><small>'+x[3]+'</small></button>').join('')+'</div><h2>Deze hele week op tafel</h2><div class="card">'+days.map((d,i)=>'<div class="line"><span><b>'+d+'</b><br><span class="muted">'+(state.menu[i]<0?'Koken bij opa en oma':base[state.menu[i]].name)+'</span></span><span>›</span></div>').join('')+'<button class="btn full" style="margin-top:13px" onclick="go(\'week\')">Weekmenu bekijken</button></div><div class="notice">💚 Probeer af en toe iets nieuws. Elke beoordeling helpt om het volgende weekmenu beter bij jullie smaak te laten passen.</div>'}function week(){return header('Ons weekmenu','Een voorstel voor het hele gezin. Dinsdag eten jullie bij opa en oma.')+'<div class="row between"><span class="pill">'+(state.approved?'✓ Week goedgekeurd':'Voorstel · aanpasbaar')+'</span><button class="tiny" onclick="suggest()">✨ Nieuw voorstel</button></div>'+days.map((d,i)=>'<div class="card day"><div class="dayhead"><strong>'+d+'</strong><span class="muted">'+(i===1?'Bij familie':'Avondeten')+'</span></div>'+(state.menu[i]<0?'<p style="margin:8px 0">👵 Opa en oma koken · geen boodschappen nodig</p>':meal(base[state.menu[i]]))+(i!==1?'<select aria-label="Gerecht voor '+d+'" style="width:100%" onchange="changeMeal('+i+',this.value)">'+base.map((r,j)=>'<option value="'+j+'" '+(j===state.menu[i]?'selected':'')+'>'+r.name+'</option>').join('')+'</select>':'')+'</div>').join('')+'<button class="btn full" onclick="approve()">'+(state.approved?'✓ Goedgekeurd · opnieuw bevestigen':'✓ Weekmenu goedkeuren')+'</button><div class="notice">Zondagavond samen bekijken. Maandagochtend boodschappen; woensdag aanvullen met verse producten of Picnic.</div>'}function recipes(){return header('Recepten ontdekken','Gezonde inspiratie voor iedereen, zonder goed of fout.')+'<div class="tabs">'+['Alles','Pasta','Vis','Vegetarisch','Snel','Favoriet'].map(c=>'<button class="chip '+(filter===c?'active':'')+'" onclick="setFilter(\''+c+'\')">'+c+'</button>').join('')+'</div><div class="grid">'+base.map((r,i)=>({r,i})).filter(x=>filter==='Alles'||x.r.cat===filter).map(({r,i})=>'<div class="card recipe"><img src="'+pic(r)+'" alt=""><div class="inner"><b>'+r.name+'</b><small>⏱ '+r.mins+' min</small><div class="stars">'+[1,2,3,4,5].map(n=>'<button title="'+n+' sterren" onclick="rate('+i+','+n+')">'+(n<=(state.ratings[i]||0)?'★':'☆')+'</button>').join('')+'</div><button class="tiny" onclick="details('+i+')">Ingrediënten bekijken →</button></div></div>').join('')+'</div>'}function aggregate(){let a={};state.menu.forEach((id,di)=>{if(id<0)return;base[id].items.forEach(([name,q,unit])=>{let k=name+'|'+unit;if(!a[k])a[k]={name,qty:0,unit,day:di};a[k].qty+=q;a[k].day=Math.min(a[k].day,di)})});[['Volkoren brood',2,'brood'],['Fruit',12,'st'],['Melk of yoghurt',2,'l'],['Havermout',500,'g']].forEach(([name,qty,unit])=>a[name+'|'+unit]={name,qty,unit,day:0});return Object.values(a)}function shop(){let all=aggregate(),mon=all.filter(x=>x.day<=2||['Volkoren brood','Fruit','Melk of yoghurt','Havermout','Zilvervliesrijst','Volkoren pasta','Passata','Kidneybonen'].includes(x.name)),wed=all.filter(x=>!mon.includes(x));function listing(arr){return arr.map(x=>{let k=x.name+'|'+x.unit;return '<label class="line"><span><input type="checkbox" '+(state.checked[k]?'checked':'')+' onchange="check(\''+k+'\',this.checked)"> &nbsp;'+x.name+'</span><b>'+x.qty+' '+x.unit+'</b></label>'}).join('')}return header('Boodschappenlijst','Alles wat je nodig hebt, automatisch vanuit het weekmenu.')+'<div class="tabs"><button class="chip '+(state.mode==='all'?'active':'')+'" onclick="mode(\'all\')">🧾 Complete lijst</button><button class="chip '+(state.mode==='slim'?'active':'')+'" onclick="mode(\'slim\')">✨ Slim verdeeld</button></div><div class="card"><div class="row between"><div><div class="eyebrow">Boodschappen</div><div class="stat">'+all.length+' <span class="muted">producten</span></div></div><button class="tiny" onclick="share()">↗ Delen</button></div></div>'+(state.mode==='all'?'<h2>Complete boodschappenlijst</h2><div class="card">'+listing(all)+'</div>':'<h2>Maandag · zelf halen</h2><p>Voor maandag en woensdag, plus houdbare basisproducten.</p><div class="card">'+listing(mon)+'</div><h2>Woensdag · aanvullen / Picnic</h2><p>Verse producten voor de tweede helft van de week.</p><div class="card">'+(wed.length?listing(wed):'Geen extra producten nodig')+'</div>')+'<div class="notice">🛒 Picnic: gebruik de gedeelde lijst om producten in Picnic te zoeken. Rechtstreeks bestellen is nog niet gekoppeld. Vergeet je statiegeldflessen niet.</div>'}function family(){return header('Mijn gezin','Persoonlijke voorkeuren, samen ontdekken en gezond opgroeien.')+'<div class="card"><h2 style="margin-top:0">Gezinsleden</h2>'+state.profiles.map((p,i)=>'<div class="person"><div class="face">'+p.emoji+'</div><div style="flex:1"><b>'+p.name+'</b><div class="muted">'+(i<2?'Volwassene':'Kind · groei & energie')+'</div></div><span class="pill">Actief</span></div>').join('')+'</div><h2>Mijn voeding</h2><div class="card"><div class="row between"><div><b>Persoonlijke porties</b><p style="margin:4px 0">Optioneel, op basis van energiebehoefte</p></div><input type="checkbox" '+(state.portions?'checked':'')+' onchange="togglePortions(this.checked)"></div>'+(state.portions?'<div class="notice">Persoonlijke berekeningen zijn nog niet actief. Voor volwassenen kunnen we later lengte, gewicht, leeftijd en activiteit gebruiken. Voor kinderen geen afvaldoelen.</div>':'<div class="notice">Standaard: algemene gezonde voeding, zonder calorie- of gewichtsdoelen.</div>')+'</div><h2>Positief samen eten</h2><div class="card"><p>🌱 Nieuwe smaken rustig proberen, waarderen wat goed gaat en gerechten aanpassen aan jullie gezin. Geen negatieve scores voor kinderen.</p><button class="btn" onclick="go(\'recipes\')">Ontdek recepten →</button></div>'}function render(){nav();document.getElementById('root').innerHTML=({home,week,recipes,shop,family}[page])()+'<footer>Gezins Eetplanner · interactieve demo 1.3 · gegevens op dit toestel</footer>'}function changeMeal(i,v){state.menu[i]=+v;state.approved=false;state.checked={};save();render()}function approve(){state.approved=true;save();render();go('shop')}function suggest(){state.menu=[3,-1,0,2,1,5,4];state.approved=false;save();render()}function setFilter(v){filter=v;render()}function rate(i,n){state.ratings[i]=n;save();render()}function mode(m){state.mode=m;save();render()}function check(k,v){state.checked[k]=v;save()}function togglePortions(v){state.portions=v;save();render()}function details(i){alert(base[i].name+'\n\nIngrediënten voor 4 personen:\n'+base[i].items.map(x=>'• '+x[0]+': '+x[1]+' '+x[2]).join('\n'))}async function share(){let t='Boodschappen Gezins Eetplanner\n'+aggregate().map(x=>'• '+x.name+': '+x.qty+' '+x.unit).join('\n');if(navigator.share){try{await navigator.share({title:'Boodschappenlijst',text:t})}catch(e){}}else if(navigator.clipboard){await navigator.clipboard.writeText(t);alert('Boodschappenlijst gekopieerd')}else alert(t)}render();
</script></body></html>
